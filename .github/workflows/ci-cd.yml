name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test backend
        working-directory: backend
        run: mvn -B test package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: npm
          # cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install -g npm@9.9.4
          npm cache clean --force
          npm install --legacy-peer-deps --no-package-lock --no-audit
          npm install --save-dev @angular-devkit/build-angular --legacy-peer-deps --no-package-lock
          npm run build

  docker-push:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/student-portal-backend:latest ./backend
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student-portal-backend:latest
      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/student-portal-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student-portal-frontend:latest

  deploy-render:
    if: github.ref == 'refs/heads/main'
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        run: curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_BACKEND_SERVICE_ID }}?key=${{ secrets.RENDER_BACKEND_DEPLOY_KEY }}"
      - name: Trigger Render frontend deploy
        run: curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_FRONTEND_SERVICE_ID }}?key=${{ secrets.RENDER_FRONTEND_DEPLOY_KEY }}"
